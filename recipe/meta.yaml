{% set name = "opentelemetry-instrumentation-chromadb" %}
{% set version = "0.57.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: f7c0dbcc94a1d9f5d5aad4953dcd163e556699db9b0ac9fec8eae0814e91b8c7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constrained:
    - chromadb

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - opentelemetry.instrumentation.chromadb
  commands:
    - pip check
    #       span = next(span for span in spans if span.name == "chroma.query.segment._query")
    #E       StopIteration
    - pytest -vvv --deselect=tests/test_query.py::test_chroma_query_segment_query
  requires:
    - pip
    - pytest
    - chromadb
    - opentelemetry-sdk

about:
  home: https://www.traceloop.com/openllmetry
  summary: OpenTelemetry Chroma DB instrumentation
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    This library allows tracing client-side calls to Chroma vector DB sent with the official Chroma library.
  dev_url: https://github.com/traceloop/openllmetry
  doc_url: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
  skip-lints:
    - invalid_url
